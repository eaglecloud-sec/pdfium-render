name: Build Eagle PDFium

on:
  workflow_dispatch:
  pull_request:
    branches:
      - scanlib-safe-font-provider
    paths:
      - ".github/workflows/pdfium-release.yml"
      - "pdfium/**"
      - "include/pdfium_7543/fpdf_catalog.h"
      - "src/bindgen/pdfium_7543.rs"
      - "src/bindings.rs"
      - "src/bindings/dynamic_bindings.rs"
      - "src/bindings/static_bindings.rs"
      - "src/pdf/document/catalog.rs"
  push:
    tags:
      - "pdfium-eagle-*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ["self-hosted", "Linux", "ubuntu22.04"]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cpu: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdfium-render
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/pdfium-binaries
          ref: a96196ffc32978819193fb82873bfb3afc089ef9
          path: pdfium-builder
          persist-credentials: false
      - name: Build PDFium
        run: pdfium-render/pdfium/scripts/build-custom-pdfium.sh pdfium-builder linux ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-linux-${{ matrix.cpu }}
          path: |
            pdfium-builder/pdfium-linux-${{ matrix.cpu }}.tgz
            pdfium-builder/pdfium-linux-${{ matrix.cpu }}.tgz.sha256

  macos:
    runs-on: ["self-hosted", "macOS", "ARM64"]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cpu: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdfium-render
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/pdfium-binaries
          ref: a96196ffc32978819193fb82873bfb3afc089ef9
          path: pdfium-builder
          persist-credentials: false
      - name: Build PDFium
        run: pdfium-render/pdfium/scripts/build-custom-pdfium.sh pdfium-builder mac ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-mac-${{ matrix.cpu }}
          path: |
            pdfium-builder/pdfium-mac-${{ matrix.cpu }}.tgz
            pdfium-builder/pdfium-mac-${{ matrix.cpu }}.tgz.sha256

  windows:
    runs-on: ["self-hosted", "Windows", "X64"]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cpu: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          path: pdfium-render
      - uses: actions/checkout@v4
        with:
          repository: bblanchon/pdfium-binaries
          ref: a96196ffc32978819193fb82873bfb3afc089ef9
          path: pdfium-builder
          persist-credentials: false
      - name: Build PDFium
        shell: bash
        run: pdfium-render/pdfium/scripts/build-custom-pdfium.sh pdfium-builder win ${{ matrix.cpu }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdfium-win-${{ matrix.cpu }}
          path: |
            pdfium-builder/pdfium-win-${{ matrix.cpu }}.tgz
            pdfium-builder/pdfium-win-${{ matrix.cpu }}.tgz.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ["self-hosted", "Linux", "ubuntu22.04"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pdfium-*
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          name: Eagle PDFium ${{ github.ref_name }}
          body: Custom PDFium 7543 dynamic libraries for scanlib-rs.
          artifacts: "release-assets/*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
